   <g id="text_1">
    <text style="font-weight: 600; font-size: 15.5px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="23.03424" y="68.141628" transform="rotate(-0 23.03424 68.141628)">Optimisation</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 600; font-size: 13.5px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="23.03424" y="105.38735" transform="rotate(-0 23.03424 105.38735)">worked, not finished</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12.3px; font-family: 'Inter'; fill: #52514e" transform="translate(23.03424 175.769503)">every search went from worse</text>
    <text style="font-size: 12.3px; font-family: 'Inter'; fill: #52514e" transform="translate(23.03424 195.821506)">than the prior to 3-4 nats</text>
    <text style="font-size: 12.3px; font-family: 'Inter'; fill: #52514e" transform="translate(23.03424 216.153142)">better; 4 of 5 finalists came</text>
    <text style="font-size: 12.3px; font-family: 'Inter'; fill: #52514e" transform="translate(23.03424 237.244879)">from the last round</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 600; font-size: 15.5px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="261.05472" y="68.141628" transform="rotate(-0 261.05472 68.141628)">Training</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 600; font-size: 13.5px; font-family: 'Inter'; fill: #0b0b0b" transform="translate(261.05472 105.38735)">members overfit;</text>
    <text style="font-weight: 600; font-size: 13.5px; font-family: 'Inter'; fill: #0b0b0b" transform="translate(261.05472 125.69048)">the ensemble repairs it</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12.3px; font-family: 'Inter'; fill: #52514e" transform="translate(261.05472 175.658034)">averaging 5 members gains</text>
    <text style="font-size: 12.3px; font-family: 'Inter'; fill: #52514e" transform="translate(261.05472 195.998319)">0.7-1.1 nats; the ensemble is</text>
    <text style="font-size: 12.3px; font-family: 'Inter'; fill: #52514e" transform="translate(261.05472 217.090056)">calibrated to conservative</text>
    <text style="font-size: 12.3px; font-family: 'Inter'; fill: #52514e" transform="translate(261.05472 237.187223)">inside the box</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 600; font-size: 15.5px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="499.0752" y="68.141628" transform="rotate(-0 499.0752 68.141628)">Calibration</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 600; font-size: 13.5px; font-family: 'Inter'; fill: #0b0b0b" transform="translate(499.0752 105.193288)">good inside,</text>
    <text style="font-weight: 600; font-size: 13.5px; font-family: 'Inter'; fill: #0b0b0b" transform="translate(499.0752 125.611378)">fails at the box edges</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12.3px; font-family: 'Inter'; fill: #52514e" transform="translate(499.0752 176.961066)">10.8 % of simulated truths lie</text>
    <text style="font-size: 12.3px; font-family: 'Inter'; fill: #52514e" transform="translate(499.0752 195.812858)">within 0.0067 of an edge,</text>
    <text style="font-size: 12.3px; font-family: 'Inter'; fill: #52514e" transform="translate(499.0752 215.976329)">where the flow puts almost</text>
    <text style="font-size: 12.3px; font-family: 'Inter'; fill: #52514e" transform="translate(499.0752 235.977403)">no mass</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 600; font-size: 15.5px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="737.09568" y="68.141628" transform="rotate(-0 737.09568 68.141628)">Comparison</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 600; font-size: 13.5px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="737.09568" y="106.573874" transform="rotate(-0 737.09568 106.573874)">no arm wins or loses</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12.3px; font-family: 'Inter'; fill: #52514e" transform="translate(737.09568 175.970339)">0 of 15 differences resolved;</text>
    <text style="font-size: 12.3px; font-family: 'Inter'; fill: #52514e" transform="translate(737.09568 196.851631)">the searches chose small</text>
    <text style="font-size: 12.3px; font-family: 'Inter'; fill: #52514e" transform="translate(737.09568 215.840837)">term weights; on R3 the tie</text>
    <text style="font-size: 12.3px; font-family: 'Inter'; fill: #52514e" transform="translate(737.09568 237.181457)">hides a trade</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 600; font-size: 14.5px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="23.994" y="352.826578" transform="rotate(-0 23.994 352.826578)">Open before any verdict on the arms</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12.5px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="23.994" y="387.610159" transform="rotate(-0 23.994 387.610159)">• run the searches longer?   • the flow's edge support: bound 5 or 10?   • confirm that the 18 flagged windows are the contaminated ones</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12.5px; font-family: 'Inter'; text-anchor: start; fill: #52514e" x="23.994" y="423.121279" transform="rotate(-0 23.994 423.121279)">To discuss: a ranking criterion that does not push the terms towards off; a second ensemble per arm,</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12.5px; font-family: 'Inter'; text-anchor: start; fill: #52514e" x="23.994" y="447.115279" transform="rotate(-0 23.994 447.115279)">to measure the seed noise of an ensemble rather than of a single member</text>
   </g>
  </g>
  <g id="text_17">
   <text style="font-size: 9px; font-family: 'Inter'; text-anchor: end; fill: #8a8984" x="954.9612" y="469.227502" transform="rotate(-0 954.9612 469.227502)">synth v4 deck | summary of the results document (synth v4 evaluation, 2026-11-16) | 2026-11-18</text>
  </g>
 </g>
