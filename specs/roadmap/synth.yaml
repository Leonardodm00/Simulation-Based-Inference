# Roadmap of the subproject synth. Source of truth for the stages and the
# theory statuses; the implementation statuses are computed by
# specs/roadmap/roadmap.py (never written by hand).
#
# Drafted by `roadmap.py init --plan`: one implementation step S<k> per
# plan step (a group; its blocks are added while the step is carried out,
# with `roadmap.py add block`) and one theory group TS<k> per step (its
# topics with `roadmap.py add topic`). Lines marked DRAFT are guesses.
schema: 1
name: synth
title: "Synthetic A2/A5: arms A2 and A5 through the pipeline on a synthetic cohort (D-118..D-120)"
repo: Leonardodm00/simulation-based-inference
branch: sci/pipeline
spec: specs/SPEC.md
hpc_branch: hpc-status
stale_after_hours: 48      # a running HPC marker older than this is reported as failing

theory:
  - id: TS1
    title: "Separability of the conditions and the gap"
    summary: "How separable the conditions are from theta against from the windows (the Bayes ceiling, the reference classifier); the gap modes as misspecification."
    refs: []
    depends_on: []
    # no status line: a group, coloured by its topics (add topic ... --parent TS1)
  - id: TS2
    title: "The synthetic benchmark's generator"
    summary: "The concepts the synthetic banks rest on: how the bench generator turns theta into a window (the user, 2026-11-03)."
    refs: []
    depends_on: []
    # no status line: a group, coloured by its topics (add topic ... --parent TS2)
  - id: TS3
    title: "The metric term and the replicate term"
    summary: "What the metric term and the replicate term pull the encoder toward (E3, E5); the replicate target when the wells share nuisance (F-bm)."
    refs: []
    depends_on: []
    # no status line: a group, coloured by its topics (add topic ... --parent TS3)
  - id: TS6
    title: "The endpoints and the paired comparison"
    summary: "The pseudo-real endpoint, coverage and the comparison paired by donor (E7)."
    refs: []
    depends_on: []
    # no status line: a group, coloured by its topics (add topic ... --parent TS6)
  - id: T2.1
    title: "How the synthetic traces are generated"
    summary: "From theta to a window: the affine map to 10 physical burst parameters (7 condition-bearing, 3 free); the spike generator for 100 units (gamma-renewal burst onsets, lognormal envelopes, fragmentation, beta participation, Poisson spikes); the IFR binned at 100 Hz, Gaussian-smoothed and divided by the units, cut into 180-s windows; the nuisance x_obs = A(nu) x + b(nu, t), nested batch : donor : well; the two priors (the box for arm S, the conditions' truncated normals for arm R); the gap's three modes."
    refs: ["SPEC 2.4", "hpc/joint/stage1/bench_burst_generator.py eqs. (1)-(13)", "bench_burst_provider.py (BENCH_AXES)", latent_sbi_simulator.py, "latent_nuisance.py (eq. N1)", latent_gap.py, "hpc/joint/docs/P7_UPSTREAM_AND_JOBS.md Table P7.2", D-119, D-120]
    parent: TS2
    depends_on: []
    status: open
    closed_on:
    decision:

implementation:
  # ---- steps of the plan (groups; blocks are added under them as they are written)
  - id: S1
    title: "Design and SPEC"
    summary: "The synthetic experiment in full notation in specs/SPEC.md -- arm S on the unit box, arm R's three conditions on donors of two wells, the gap at pi 0 and 0.3, the 180-s windows, the sizes and the seeds -- with the separability check that fixed \"medium\"."
    depends_on: []
    needs_theory: [TS1]
    needs_hpc: false
  - id: S2
    title: "Synthetic banks"
    summary: "The bank builder gains a box prior for arm S that the runner reads as the unit box, balanced conditions on regular centres with a scale, distinct seeds for the two arms (F-aw), bank-wide ids (F-at), and the range shift at pi > 0 with fragment_duty clipped at 1 (F-av)."
    depends_on: [S1]
    needs_theory: [TS2]
    needs_hpc: false
  - id: S3
    title: "Arms A2 and A5 on a cohort"
    summary: "A2's class count taken from the metric source (F-t), replicate pairs across the two wells of one donor (F-ab), and a refusal when A5 has no pair (F-aa)."
    depends_on: [S1]
    needs_theory: [TS3]
    needs_hpc: false
  - id: S4
    title: "The pipeline's synthetic data set"
    summary: "A synthetic data-set kind of the pipeline -- no S1-S6 of a recorded data set; the banks built by the bench builder, one job per shard and a record job; a search and a best fit per entry -- and the project synth (tag synth, 120 cores)."
    depends_on: [S2, S3]
    needs_theory: []
    needs_hpc: false
  - id: S5
    title: "Runs on davinci"
    summary: "One arm-S bank, two arm-R banks (pi 0 and 0.3), the five searches (S-A2 and S-A5 on each, one S-A1, D-122) of about 60 trials, and their best fits."
    depends_on: [S4]
    needs_theory: []
    needs_hpc: true
  - id: S6
    title: Evaluation
    summary: "Per arm and gap level, the NLL of the withheld theta, the coverage and the condition recovered; A2 - A1 and A5 - A1 paired by donor."
    depends_on: [S5]
    needs_theory: [TS6]
    needs_hpc: false
  - id: I11
    title: "the box prior for arm S"
    summary: "build_latent_bank.py --prior box: theta uniform on the unit box, cls -1, latent_spec kind box; the runner reads it as the unit box (L0 = 0)."
    block: 11
    parent: S2
    depends_on: []
    needs_theory: []
    needs_hpc: false
    jobs: []
  - id: I12
    title: "arm R's cohort and bank-wide ids"
    summary: "Regular class centres from the DSN's simplex with a scale, a set number of donors per class on a seeded permutation, and donor/well/batch ids unique across shards (F-at)."
    block: 12
    parent: S2
    depends_on: []
    needs_theory: []
    needs_hpc: false
    jobs: []
  - id: I13
    title: "the shifted duty clipped at 1"
    summary: "fragment_duty clipped at 1 under the range shift, so a pi = 0.3 bench cohort builds (F-av)."
    block: 13
    parent: S2
    depends_on: []
    needs_theory: []
    needs_hpc: false
    jobs: []
  - id: I14
    title: "arms A2 and A5 on a cohort"
    summary: "Replicate pairs across two wells of one donor (F-ab), A5 refuses without pairs (F-aa), the DSN loss's classes counted on its source (F-t), a refusal when arms S and R share a seed (F-aw)."
    block: 14
    parent: S3
    depends_on: [I11, I12]
    needs_theory: []
    needs_hpc: false
    jobs: []
  - id: I15
    title: "the synthetic kind: configuration, graph and run views"
    summary: "\"kind\": \"synthetic\" -- its schema and cross-checks (distinct seeds, shard sizes, the real banks the searches name); the graph of 13 stages; each search and best fit is S7 and S8 on its own view (folders, campaign, the simulated bank and its real bank, S-A1 included)."
    block: 15
    parent: S4
    depends_on: []
    needs_theory: []
    needs_hpc: false
    jobs: []
  - id: I16
    title: "the synthetic banks"
    summary: "One job per shard of build_latent_bank.py, then a record job (tools/synth_bank_record.py: CRCs, digests, rows, wells per donor, classes); a shard already built is kept, a folder of another build refused."
    block: 16
    parent: S4
    depends_on: [I11, I12, I13, I15]
    needs_theory: []
    needs_hpc: false
    jobs: []
  - id: I17
    title: "the project synth"
    summary: "projects/synth/synth.json (D-118..D-123: arm S in 20 shards, R0 and R3, five searches of 60 trials on 8-core trials, best fits of 5 members, 120 cores) and its run sheet Y1-Y4; end to end on a reduced copy under the fake PBS."
    block: 17
    parent: S4
    depends_on: [I14, I15, I16]
    needs_theory: []
    needs_hpc: false
    jobs: []
  - id: I18
    title: "the other arm's best fit"
    summary: "best_fit_alt_<q>: for each search with a term, the best trial on L of the arm its finalist is not, fitted as a second ensemble of 5 members with the best fit's settings (the tuner's finalists --arm; alt_best_fit, synth.json v3; D-126)."
    block: 18
    parent: S6
    depends_on: []
    needs_theory: []
    needs_hpc: false
    jobs: []
  - id: I19
    title: "the evaluation's sampler"
    summary: "One davinci job per ensemble: the members rebuilt from their records and checkpoints; per data set (arm S's report split, R0, R3, R3 against theta-dagger) the NLL at the reference, posterior draws, the mixture's log density at the draws and the embeddings, saved as .npz (drafted)."
    block: 19
    parent: S6
    depends_on: [I18]
    needs_theory: []
    needs_hpc: true
    jobs: ["hpc/pipeline/evaluation/jobs/eval_sample.pbs"]
  - id: I20
    title: "the evaluation's quantities"
    summary: "From the .npz: NLL per window and donor, HPD expected coverage, SBC ranks, TARP, recovery, z-scores and contraction, the donor-paired differences with their bootstrap, the embeddings' MMD, the posterior-predictive check, L-C2ST (drafted)."
    block: 20
    parent: S6
    depends_on: [I19]
    needs_theory: []
    needs_hpc: false
    jobs: []
  - id: I21
    title: "the evaluation's figures"
    summary: "The literature's figures per arm and per comparison, four families: calibration, accuracy and sharpness, posterior views and checks, embeddings and the search (drafted)."
    block: 21
    parent: S6
    depends_on: [I20]
    needs_theory: []
    needs_hpc: false
    jobs: []
  - id: I22
    title: "the evaluation's jobs and run sheet"
    summary: "The sampling and report job scripts with the roadmap's markers, the README's run sheet, and the evaluation end to end on the reduced project (drafted)."
    block: 22
    parent: S6
    depends_on: [I19, I20, I21]
    needs_theory: []
    needs_hpc: true
    jobs: ["hpc/pipeline/evaluation/jobs/eval_report.pbs"]
