    title: "the sampler on a recorded project"
    summary: "One cluster job per ensemble: the members rebuilt and checked against their own per-row NLL; on the held-out simulations the NLL on every row and the draws on the draw rows; on the recordings the draws and their densities; the embeddings and the gate's roles; saved as .npz (drafted)."
