    summary: "NLL, expected coverage, SBC, TARP, recovery and contraction on the held-out simulations, with the edge rows apart; per recorded window the posterior's summaries and contraction; per well the mixture over its windows; the gate's p-values and flagged shares; the arms compared on the simulations; and the tool that checks the new path against the synthetic evaluation (drafted)."
